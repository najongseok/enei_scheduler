<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>단말기 인증</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#10262B; --line:#2A4E56; --mist:#EAF1F2; --muted:#6C8A91;
  --teal:#2E8C9E; --teal-deep:#1F6F80; --clay:#C6553F; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Pretendard,'Malgun Gothic',sans-serif;
  background:var(--ink); color:#fff;
  min-height:100vh; display:grid; place-items:center; padding:24px;
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

.box{width:min(420px,100%);text-align:center}
.mark{
  width:56px;height:56px;border-radius:16px;background:var(--teal);
  display:grid;place-items:center;margin:0 auto 22px;font-size:1.6rem
}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.sub{color:#93B0B6;margin-top:10px;line-height:1.6;font-size:.98rem}

.display{
  height:78px;margin:28px 0 18px;border:2px solid var(--line);border-radius:var(--r);
  background:#16323A;display:flex;align-items:center;justify-content:center;
  font-size:2rem;letter-spacing:.4em;font-variant-numeric:tabular-nums;
}
.display.empty{color:#5C7C83;font-size:1rem;letter-spacing:0}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.key{
  height:68px;font-size:1.6rem;font-weight:600;border-radius:var(--r);
  background:#1D3F47;color:#fff;transition:transform .06s,background .12s;
}
.key:active{transform:scale(.96);background:#26505A}
.key.fn{font-size:1rem;font-weight:600;color:#93B0B6}
.key.go{background:var(--teal)}
.key.go:active{background:var(--teal-deep)}

.err{
  margin-top:18px;background:#3A1F1B;color:#F0A697;border-radius:10px;
  padding:12px 16px;font-weight:600;font-size:.95rem;
}
.hint{margin-top:26px;color:#5C7C83;font-size:.86rem;line-height:1.6}
input[name=passcode]{position:absolute;opacity:0;pointer-events:none}

@media(max-height:640px){
  .display{height:62px;margin:18px 0 12px}
  .key{height:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="box">
  <div class="mark">🔒</div>
  <h1>단말기 인증 코드를 입력하세요</h1>
  <p class="sub">이 기기에서 처음 출퇴근을 쓰는 경우에만 입력합니다.<br>
     한 번 인증하면 다음부터는 바로 사용할 수 있어요.</p>

  <form method="post" action="/kiosk-login" id="f">
    <div class="display empty" id="disp">인증 코드</div>
    <input type="text" name="passcode" id="code" autocomplete="off">

    <div class="keypad">
      {% for n in [1,2,3,4,5,6,7,8,9] %}<button type="button" class="key" data-k="{{ n }}">{{ n }}</button>{% endfor %}
      <button type="button" class="key fn" data-k="clear">지우기</button>
      <button type="button" class="key" data-k="0">0</button>
      <button type="submit" class="key go">확인</button>
    </div>
  </form>

  {% if error %}<p class="err">{{ error }}</p>{% endif %}

  <p class="hint">코드를 모르시면 관리자에게 문의하세요.</p>
</div>

<script>
const code = document.getElementById("code");
const disp = document.getElementById("disp");
function paint(){
  disp.classList.toggle("empty", code.value.length === 0);
  disp.textContent = code.value ? "●".repeat(code.value.length) : "인증 코드";
}
document.querySelectorAll(".key[data-k]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.k;
  if (k === "clear") code.value = code.value.slice(0, -1);
  else if (code.value.length < 12) code.value += k;
  paint();
}));
document.addEventListener("keydown", e => {
  if (/^[0-9a-zA-Z]$/.test(e.key) && code.value.length < 12) { code.value += e.key; paint(); }
  else if (e.key === "Backspace") { e.preventDefault(); code.value = code.value.slice(0, -1); paint(); }
});
document.getElementById("f").addEventListener("submit", e => {
  if (!code.value) e.preventDefault();
});
paint();
</script>
</body>
</html>
