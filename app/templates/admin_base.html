<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}관리자{% endblock %} · ENEI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root{
  --ink:#10262B; --paper:#fff; --bg:#F4F7F8; --mist:#EAF1F2; --line:#DFE8EA;
  --muted:#6C8A91; --teal:#2E8C9E; --teal-deep:#1F6F80; --amber:#E9A23B;
  --clay:#C6553F; --grass:#3E8E5A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
a{color:inherit}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header .brand{font-weight:800;letter-spacing:-.02em}
header nav{display:flex;gap:6px;flex-wrap:wrap}
header nav a{padding:7px 14px;border-radius:8px;color:#C9DBDE;text-decoration:none;font-weight:600;font-size:.92rem}
header nav a.on,header nav a:hover{background:#1F4149;color:#fff}
header .me{margin-left:auto;font-size:.88rem;color:#9FBBC0}

main{padding:22px;max-width:1240px;margin:0 auto}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:18px;font-size:.95rem}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.btn{padding:11px 18px;border:0;border-radius:9px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
.btn:hover{background:var(--teal-deep)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--amber)}
.btn.danger{background:var(--clay)}
.btn:disabled{background:#CBD9DC;cursor:not-allowed}
input[type=text],input[type=number],input[type=password],select{
  padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}

/* 숫자 입력칸의 브라우저 기본 스피너(업/다운 화살표)를 숨깁니다.
   스피너가 입력 영역을 침범해 숫자가 잘려 보이는 문제를 없앱니다. */
input[type=number]{
  -moz-appearance:textfield;
  appearance:textfield;
  width:110px;text-align:right;
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  appearance:none;
  margin:0;
}
/* 시:분 입력칸 — 두 자리가 온전히 보이도록 여유 있게 */
input.time{width:60px;text-align:center;padding:9px 6px;font-variant-numeric:tabular-nums}

.btn.mini{padding:5px 10px;font-size:.85rem}

details{border-bottom:1px solid var(--line)}
details:last-of-type{border-bottom:0}
details>summary{
  padding:13px 18px;cursor:pointer;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:9px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--muted);font-size:.85rem}
details[open]>summary::before{content:"▾"}
details>summary:hover{background:#FAFCFC}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.card h2{font-size:1rem;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}

table{width:100%;border-collapse:collapse}
th{background:var(--mist);color:var(--muted);font-size:.82rem;font-weight:700;text-align:left;padding:11px 12px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #F0F4F5;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:#FAFCFC}
td.num,th.num{text-align:right}
.total-row td{background:var(--ink);color:#fff;font-weight:700}

.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.76rem;font-weight:700}
.badge-auto{background:var(--mist);color:var(--muted)}
.badge-on{background:#E2F1E8;color:var(--grass)}
.badge-off{background:#F7E3DF;color:var(--clay)}
.badge-warn{background:#FBEEDA;color:#9A6716}
.tag-net{background:#E6F3F5;color:var(--teal-deep)}

.empty{padding:26px;color:var(--muted);text-align:center}
.note{font-size:.85rem;color:var(--muted);line-height:1.6;padding:14px 18px;background:#FBFDFD;border-top:1px solid var(--line)}
.sticky-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.count{color:var(--muted);font-weight:600;margin-right:auto}

@media(max-width:760px){
  main{padding:14px}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
  td,th{font-size:.88rem;padding:9px 8px}
}
</style>
</head>
<body>
<header>
  <span class="brand">ENEI 관리자</span>
  <nav>
    <a href="/admin/payroll" class="{{ 'on' if nav=='payroll' }}">급여</a>
    <a href="/admin/records" class="{{ 'on' if nav=='records' }}">근무기록</a>
    <a href="/admin/workers" class="{{ 'on' if nav=='workers' }}">직원</a>
    <a href="/admin/settings" class="{{ 'on' if nav=='settings' }}">설정</a>
  </nav>
  <span class="me">{{ admin.username }} · <a href="/admin/logout">로그아웃</a></span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
