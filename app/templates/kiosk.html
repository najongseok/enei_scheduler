<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>출퇴근 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#10262B; --ink-soft:#1B3A41; --line:#2A4E56;
  --paper:#FFFFFF; --mist:#EAF1F2; --muted:#6C8A91;
  --teal:#2E8C9E; --teal-deep:#1F6F80; --amber:#E9A23B; --clay:#C6553F; --grass:#3E8E5A;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Pretendard,'Malgun Gothic',sans-serif;
  background:var(--ink); color:var(--ink);
  -webkit-user-select:none; user-select:none;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

.stage{display:grid;grid-template-columns:1fr 460px;height:100vh}

/* ── 왼쪽: 시계 + 상태 ── */
.left{
  background:var(--ink); color:#fff;
  padding:clamp(28px,4vh,56px) clamp(32px,4vw,64px);
  display:flex; flex-direction:column; justify-content:space-between;
}
.place{font-size:.85rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.clock{
  font-size:clamp(4.5rem,11vw,9rem); font-weight:800; line-height:.92;
  letter-spacing:-.04em; font-variant-numeric:tabular-nums;
  border-bottom:2px solid var(--line); padding-bottom:.12em;
}
.clock .sec{font-size:.34em;font-weight:600;color:var(--teal);margin-left:.18em;letter-spacing:0}
.date{margin-top:14px;font-size:1.15rem;color:#B9CED2;font-weight:500}

/* 시그니처: 오늘의 근무 리본 */
.ribbon{margin-top:auto;padding-top:28px}
.ribbon h2{font-size:.82rem;letter-spacing:.18em;color:var(--muted);font-weight:600;margin-bottom:12px}
.track{height:22px;background:var(--ink-soft);border-radius:11px;overflow:hidden;display:flex}
.track .seg{height:100%}
.seg-work{background:var(--teal)}
.seg-break{background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 6px,#c9892e 6px,#c9892e 12px)}
.track-empty{color:var(--muted);font-size:.95rem;padding:2px 0}
.legend{display:flex;gap:20px;margin-top:12px;font-size:.9rem;color:#B9CED2;flex-wrap:wrap}
.legend b{font-weight:600;color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}

/* ── 오른쪽: 조작 패널 ── */
.right{background:var(--paper);padding:36px 34px;display:flex;flex-direction:column}
.panel-title{font-size:1.35rem;font-weight:700;margin-bottom:6px}
.panel-sub{color:var(--muted);font-size:.95rem;margin-bottom:22px}

.pin-display{
  height:74px;border:2px solid var(--mist);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:2rem;letter-spacing:.4em;margin-bottom:16px;background:#FAFCFC;
}
.pin-display.empty{color:#BBCACD;font-size:1rem;letter-spacing:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{
  height:74px;font-size:1.7rem;font-weight:600;border-radius:var(--r);
  background:var(--mist);color:var(--ink);transition:transform .06s,background .12s;
}
.key:active{transform:scale(.96);background:#DCE8EA}
.key.fn{font-size:1.05rem;font-weight:600;background:#F3F7F8;color:var(--muted)}
.key.go{background:var(--teal);color:#fff;font-size:1.15rem}
.key.go:active{background:var(--teal-deep)}

.msg{margin-top:16px;min-height:24px;font-size:1rem;font-weight:600}
.msg.err{color:var(--clay)}
.msg.ok{color:var(--grass)}

.who{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.who small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.actions{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.act{
  height:96px;border-radius:var(--r);font-size:1.5rem;font-weight:700;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.act-in{background:var(--teal)} .act-in:active{background:var(--teal-deep)}
.act-out{background:var(--clay)}
.act-ghost{background:#fff;color:var(--ink);border:2px solid var(--mist);height:64px;font-size:1.1rem}
.act[disabled]{background:#D9E4E6;color:#8FA6AA;cursor:not-allowed}
.linkish{margin-top:auto;background:none;color:var(--muted);font-size:.95rem;padding:10px;text-decoration:underline}

/* ── 휴게시간 묻는 화면 ── */
.sheet{position:fixed;inset:0;background:rgba(16,38,43,.72);display:none;place-items:center;z-index:20}
.sheet.on{display:grid}
.card{background:#fff;border-radius:20px;padding:38px;width:min(680px,92vw)}
.card h3{font-size:1.5rem;font-weight:800;margin-bottom:8px}
.card p{color:var(--muted);margin-bottom:24px;line-height:1.55}
.brk{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.brk button{
  padding:26px 12px;border-radius:var(--r);background:var(--mist);
  font-size:1.25rem;font-weight:700;color:var(--ink);border:3px solid transparent;
}
.brk button small{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-top:6px}
.brk button[aria-pressed="true"]{border-color:var(--teal);background:#E6F3F5}
.brk button .tag{display:inline-block;font-size:.72rem;background:var(--teal);color:#fff;padding:2px 8px;border-radius:99px;margin-top:8px}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin-top:20px;color:var(--muted)}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--mist);font-size:1.5rem;font-weight:700}
.card .confirm{width:100%;margin-top:26px;height:82px;border-radius:var(--r);background:var(--clay);color:#fff;font-size:1.3rem;font-weight:700}
.card .cancel{width:100%;margin-top:10px;height:52px;background:none;color:var(--muted);font-size:1rem}

/* ── 기록 조회 ── */
.recs{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;padding:32px;z-index:30}
.recs.on{display:flex}
.recs h3{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.recs .sum{color:var(--muted);margin-bottom:18px}
.recs .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:1.05rem}
th{position:sticky;top:0;background:var(--mist);padding:12px;font-weight:600;color:var(--muted);font-size:.9rem;text-align:left}
td{padding:14px 12px;border-bottom:1px solid #EEF3F4;font-variant-numeric:tabular-nums}
.recs .close{margin-top:18px;height:64px;border-radius:var(--r);background:var(--ink);color:#fff;font-size:1.1rem;font-weight:700}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .left{padding:22px 24px}
  .clock{font-size:3.6rem}
  .ribbon{margin-top:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage">
  <!-- 왼쪽 -->
  <section class="left">
    <div>
      <p class="place">출퇴근 기록</p>
      <div class="clock" id="clock">--:--<span class="sec">--</span></div>
      <p class="date" id="date"></p>
    </div>

    <div class="ribbon">
      <h2>오늘의 근무</h2>
      <div id="ribbonBody"><p class="track-empty">번호를 입력하면 오늘 기록이 표시됩니다.</p></div>
    </div>
  </section>

  <!-- 오른쪽 -->
  <section class="right">
    <!-- 1단계: PIN -->
    <div id="stepPin">
      <h1 class="panel-title">번호를 입력해 주세요</h1>
      <p class="panel-sub">본인 고유번호 4자리</p>
      <div class="pin-display empty" id="pinDisplay">고유번호</div>
      <div class="keypad">
        {% for n in [1,2,3,4,5,6,7,8,9] %}<button class="key" data-k="{{ n }}">{{ n }}</button>{% endfor %}
        <button class="key fn" data-k="clear">지우기</button>
        <button class="key" data-k="0">0</button>
        <button class="key go" data-k="enter">확인</button>
      </div>
      <p class="msg" id="pinMsg"></p>
    </div>

    <!-- 2단계: 출퇴근 -->
    <div id="stepWork" hidden>
      <p class="who" id="whoName">—<small id="whoState"></small></p>
      <div class="actions">
        <button class="act act-in" id="btnIn">출근</button>
        <button class="act act-out" id="btnOut">퇴근</button>
        <button class="act act-ghost" id="btnRecs">내 근무기록 보기</button>
      </div>
      <p class="msg" id="workMsg"></p>
      <button class="linkish" id="btnLogout">처음으로</button>
    </div>
  </section>
</div>

<!-- 퇴근 시 휴게시간 확인 -->
<div class="sheet" id="breakSheet" role="dialog" aria-modal="true" aria-labelledby="breakTitle">
  <div class="card">
    <h3 id="breakTitle">오늘 쉬신 시간을 알려주세요</h3>
    <p>실제로 쉰 시간만 고르면 됩니다. 바빠서 못 쉬었으면 <b>안 쉼</b>을 누르세요.<br>고른 시간만 근무시간에서 빠집니다.</p>
    <div class="brk" id="brkOptions">
      <button data-v="0" aria-pressed="false">안 쉼<small>0분</small></button>
      <button data-v="30" aria-pressed="false">30분<small>짧은 식사</small></button>
      <button data-v="60" aria-pressed="false">1시간<small>식사·휴식</small></button>
    </div>
    <div class="stepper">
      <button id="brkMinus" aria-label="10분 줄이기">−</button>
      <span>직접 조정 · <b id="brkValue">0</b>분</span>
      <button id="brkPlus" aria-label="10분 늘리기">+</button>
    </div>
    <button class="confirm" id="brkConfirm">이 시간으로 퇴근하기</button>
    <button class="cancel" id="brkCancel">취소</button>
  </div>
</div>

<!-- 내 근무기록 -->
<div class="recs" id="recsView">
  <h3 id="recsTitle">내 근무기록</h3>
  <p class="sum" id="recsSum"></p>
  <div class="scroll">
    <table>
      <thead><tr><th>날짜</th><th>출근</th><th>퇴근</th><th>휴게</th><th>근무시간</th></tr></thead>
      <tbody id="recsBody"></tbody>
    </table>
  </div>
  <button class="close" id="recsClose">닫기</button>
</div>

<script>
const $ = id => document.getElementById(id);
let pin = "", state = null, idleTimer = null, suggested = 0, chosenBreak = 0;

/* 시계 */
const DAYS = ["일","월","화","수","목","금","토"];
setInterval(() => {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  $("clock").innerHTML = `${p(d.getHours())}:${p(d.getMinutes())}<span class="sec">${p(d.getSeconds())}</span>`;
  $("date").textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
}, 250);

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 && !state) {   // 기기 인증이 풀린 경우
    location.href = "/kiosk-login";
    return;
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "잠시 후 다시 시도해 주세요.");
  return data;
}

/* PIN 패드 */
function renderPin() {
  const el = $("pinDisplay");
  el.classList.toggle("empty", pin.length === 0);
  el.textContent = pin ? "●".repeat(pin.length) : "고유번호";
}
document.querySelectorAll(".key").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.k;
  if (k === "clear") pin = pin.slice(0, -1);
  else if (k === "enter") return submitPin();
  else if (pin.length < 8) pin += k;
  renderPin();
}));
document.addEventListener("keydown", e => {          // 바코드 스캐너·키보드 입력도 지원
  if ($("stepWork").hidden === false) return;
  if (/^[0-9]$/.test(e.key) && pin.length < 8) { pin += e.key; renderPin(); }
  else if (e.key === "Backspace") { pin = pin.slice(0, -1); renderPin(); }
  else if (e.key === "Enter") submitPin();
});

async function submitPin() {
  if (!pin) return;
  try {
    state = await api("/api/login", { pin });
    pin = ""; renderPin(); $("pinMsg").textContent = "";
    showWork();
  } catch (e) {
    pin = ""; renderPin();
    $("pinMsg").className = "msg err";
    $("pinMsg").textContent = e.message;
  }
}

/* 화면 전환 */
function showWork() {
  $("stepPin").hidden = true; $("stepWork").hidden = false;
  paint();
  resetIdle();
}
function showPin() {
  clearTimeout(idleTimer);
  $("stepWork").hidden = true; $("stepPin").hidden = false;
  $("recsView").classList.remove("on"); $("breakSheet").classList.remove("on");
  $("workMsg").textContent = ""; state = null;
  $("ribbonBody").innerHTML = '<p class="track-empty">번호를 입력하면 오늘 기록이 표시됩니다.</p>';
  fetch("/api/logout", { method: "POST" });
}
function resetIdle() {                                 // 3분 무조작 시 자동 로그아웃
  clearTimeout(idleTimer);
  idleTimer = setTimeout(showPin, 3 * 60 * 1000);
}
document.addEventListener("click", resetIdle);

/* 상태 렌더링 */
function paint() {
  const s = state;
  $("whoName").firstChild.textContent = s.name + " 님";
  const label = { not_in: "아직 출근 전이에요", working: "근무 중", done: "오늘 퇴근했어요" }[s.status];
  $("whoState").textContent = label;

  $("btnIn").disabled  = s.status !== "not_in";
  $("btnOut").disabled = s.status !== "working";

  // 근무 리본
  const body = $("ribbonBody");
  if (s.status === "not_in") {
    body.innerHTML = '<p class="track-empty">오늘 출근 기록이 없습니다.</p>';
    return;
  }
  const total = s.status === "done" ? (s.work_minutes + (s.break_minutes || 0)) : (s.elapsed_minutes || 0);
  const brk = s.status === "done" ? (s.break_minutes || 0) : 0;
  const work = Math.max(total - brk, 0);
  const pct = v => total ? (v / total * 100).toFixed(1) : 0;

  body.innerHTML = `
    <div class="track">
      <div class="seg seg-work" style="width:${pct(work)}%"></div>
      <div class="seg seg-break" style="width:${pct(brk)}%"></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--teal)"></i>출근 <b>${s.in_time || "-"}</b></span>
      <span><i class="dot" style="background:#B9CED2"></i>퇴근 <b>${s.out_time || "근무 중"}</b></span>
      <span><i class="dot" style="background:var(--amber)"></i>휴게 <b>${brk}분</b></span>
      <span>실근무 <b>${Math.floor(work/60)}시간 ${work%60}분</b></span>
    </div>`;
}

/* 출근 */
$("btnIn").addEventListener("click", async () => {
  try {
    state = await api("/api/clock-in", {});
    $("workMsg").className = "msg ok";
    $("workMsg").textContent = `${state.in_time} 출근 처리됐습니다. 좋은 하루 보내세요!`;
    paint();
    setTimeout(showPin, 3000);
  } catch (e) { $("workMsg").className = "msg err"; $("workMsg").textContent = e.message; }
});

/* 퇴근 → 휴게시간 확인 시트 */
$("btnOut").addEventListener("click", () => {
  suggested = state.suggested_break ?? 0;
  chosenBreak = suggested;
  // 법정 권장값을 미리 눌러두되, 근로자가 언제든 0으로 바꿀 수 있게 합니다.
  document.querySelectorAll("#brkOptions button").forEach(b => {
    b.querySelector(".tag")?.remove();
    b.setAttribute("aria-pressed", String(Number(b.dataset.v) === chosenBreak));
    if (Number(b.dataset.v) === suggested && suggested > 0) {
      b.insertAdjacentHTML("beforeend", '<span class="tag">기본 권장</span>');
    }
  });
  $("brkValue").textContent = chosenBreak;
  $("breakSheet").classList.add("on");
});

function setBreak(v) {
  chosenBreak = Math.max(0, Math.min(v, 600));
  $("brkValue").textContent = chosenBreak;
  document.querySelectorAll("#brkOptions button").forEach(b =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.v) === chosenBreak)));
}
document.querySelectorAll("#brkOptions button").forEach(b =>
  b.addEventListener("click", () => setBreak(Number(b.dataset.v))));
$("brkPlus").addEventListener("click", () => setBreak(chosenBreak + 10));
$("brkMinus").addEventListener("click", () => setBreak(chosenBreak - 10));
$("brkCancel").addEventListener("click", () => $("breakSheet").classList.remove("on"));

$("brkConfirm").addEventListener("click", async () => {
  try {
    state = await api("/api/clock-out", { break_minutes: chosenBreak });
    $("breakSheet").classList.remove("on");
    $("workMsg").className = "msg ok";
    $("workMsg").textContent =
      `${state.out_time} 퇴근 처리됐습니다. 오늘 ${Math.floor(state.work_minutes/60)}시간 ${state.work_minutes%60}분 근무하셨어요.`;
    paint();
    setTimeout(showPin, 4000);
  } catch (e) {
    $("breakSheet").classList.remove("on");
    $("workMsg").className = "msg err"; $("workMsg").textContent = e.message;
  }
});

/* 내 기록 */
$("btnRecs").addEventListener("click", async () => {
  try {
    const d = await api("/api/my-records");
    $("recsTitle").textContent = `${state.name} 님 · ${d.year}년 ${d.month}월`;
    $("recsSum").textContent = `${d.days}일 근무 · 합계 ${d.total_hours}시간`;
    $("recsBody").innerHTML = d.records.length
      ? d.records.map(r => `<tr>
          <td>${r.date.slice(5).replace("-", "/")}${r.is_holiday ? " 🔴" : ""}</td>
          <td>${r.in}</td><td>${r.out}</td>
          <td>${r.break ?? "-"}분</td>
          <td>${r.minutes != null ? Math.floor(r.minutes/60) + "시간 " + r.minutes%60 + "분" : "근무 중"}</td>
        </tr>`).join("")
      : '<tr><td colspan="5" style="color:#6C8A91;padding:28px 12px">이번 달 기록이 아직 없습니다.</td></tr>';
    $("recsView").classList.add("on");
  } catch (e) { $("workMsg").className = "msg err"; $("workMsg").textContent = e.message; }
});
$("recsClose").addEventListener("click", () => $("recsView").classList.remove("on"));
$("btnLogout").addEventListener("click", showPin);
renderPin();
</script>
</body>
</html>
