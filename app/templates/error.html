<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>안내</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Malgun Gothic',sans-serif;background:#10262B;color:#fff;
     display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}
.wrap{max-width:520px}
.code{font-size:.8rem;letter-spacing:.24em;color:#6C8A91;margin-bottom:14px}
h1{font-size:1.7rem;font-weight:800;line-height:1.4;letter-spacing:-.02em}
p{color:#B9CED2;margin-top:16px;line-height:1.7}
a{display:inline-block;margin-top:28px;padding:13px 26px;border-radius:10px;
  background:#2E8C9E;color:#fff;text-decoration:none;font-weight:700}
</style></head>
<body><div class="wrap">
  <p class="code">{{ code }}</p>
  <h1>{{ detail }}</h1>
  <p>문제가 계속되면 관리자에게 알려주세요.</p>
  <a href="/">처음으로</a>
</div></body></html>
